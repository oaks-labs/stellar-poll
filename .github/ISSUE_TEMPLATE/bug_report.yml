name: Bug Report
description: Create a report to help us improve StellarPoll
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe what happened accurately.
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior
      placeholder: |
        1. Connect wallet
        2. Create poll with...
        3. Submit transaction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Wallet extension, and network mode
      placeholder: Chrome 124, Windows 11, Freighter v5.8 Testnet
    validations:
      required: true
