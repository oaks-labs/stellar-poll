name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract

      - name: Run Contract Unit & Integration Tests
        run: cargo test --manifest-path contract/Cargo.toml

      - name: Build Contract Release WASM
        run: cargo build --manifest-path contract/Cargo.toml --release --target wasm32-unknown-unknown

  frontend:
    name: Frontend & SDK Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Lint Codebase
        run: npm run lint

      - name: Run Test Suite
        run: npm run test

      - name: Type Check & Build Web App
        run: npm run build

      - name: Verify SDK Quickstart Example
        run: npm run example:quickstart
